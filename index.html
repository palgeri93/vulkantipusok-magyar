<!doctype html>
<html lang="hu">
<meta charset="utf-8"><link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vulkántípusok – magyar változat</title>
<style>
html,body{margin:0;min-height:100%;background:#ededed;color:#333;font:14px Arial,sans-serif}main{width:min(100%,1000px);margin:24px auto}#simulator{width:100%;aspect-ratio:800.0/600.0;background:white}ruffle-player{width:100%;height:100%;display:block}footer{line-height:1.6;padding:12px 8px}a{color:#2255a0}#error{padding:20px;background:#fff3cd}button{font:inherit;cursor:pointer;float:right;padding:5px 12px}body.full main{width:100%;margin:0}body.full #simulator{height:calc(100vh - 60px);aspect-ratio:auto}
</style>
<main><div id="error" hidden></div><div id="simulator"></div>
<footer><button id="large">Nagyítás</button>Vulkántípusok · Magyar adaptáció<br>Az eredeti SWF magyar feliratokkal, helyi Ruffle futtatókörnyezettel. Internetkapcsolat nem szükséges.</footer></main>
<script>
window.RufflePlayer={config:{autoplay:"on",unmuteOverlay:"hidden",backgroundColor:"#425567",letterbox:"on",contextMenu:"off",allowScriptAccess:false,showSwfDownload:false,preferredRenderer:"canvas"}};
document.getElementById('large').onclick=()=>{document.body.classList.toggle('full')};
window.addEventListener('DOMContentLoaded',async()=>{
const error=document.getElementById('error');
if(location.protocol==='file:'){error.hidden=false;error.textContent='A szimulátort az inditas.cmd fájllal indítsd el. A böngésző a helyi fájlok közvetlen megnyitását korlátozza.';return;}
try{const player=window.RufflePlayer.newest().createPlayer();document.getElementById('simulator').appendChild(player);await player.ruffle().load({url:'magyar.swf'});window.simulatorReady=true;}catch(e){error.hidden=false;error.textContent='Nem sikerült betölteni a szimulátort: '+e.message;}
});
</script><script src="ruffle/ruffle.js"></script>
</html>
